# Explicit core transports for the Zephyr 4.1-era main branch.
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

# Keep split battery reporting available on the right/central half.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# First-article power policy:
# Deep sleep is intentionally OFF for the initial Studio-enabled central build.
# Upstream ZMK issue #3195 remains open on Zephyr 4.1: Studio + deep sleep can
# prevent a central nice!nano from waking normally. Enable after that is fixed
# or after choosing to build without Studio.
CONFIG_ZMK_SLEEP=n

# RGB deliberately omitted/disabled for first keyboard + split + Cirque tests.
CONFIG_ZMK_RGB_UNDERGLOW=n
