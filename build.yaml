---
include:
  - board: nice_nano//zmk
    shield: keyball61_left
    artifact-name: keyball61_left

  # Plain central build is useful as a fallback while bringing up the hardware.
  - board: nice_nano//zmk
    shield: keyball61_right
    artifact-name: keyball61_right

  # Preferred central build with ZMK Studio over USB.
  - board: nice_nano//zmk
    shield: keyball61_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: keyball61_right_studio

  # Keyball44 Rev1 uses separate right-half builds until the M7U adapter has a
  # hardware-safe way to distinguish I2C Cirque from SPI PMW3360.
  - board: nice_nano//zmk
    shield: keyball44_left
    artifact-name: keyball44_left

  - board: nice_nano//zmk
    shield: keyball44_right_cirque
    artifact-name: keyball44_right_cirque

  - board: nice_nano//zmk
    shield: keyball44_right_cirque
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: keyball44_right_cirque_studio

  # Experimental: requires stock PMW3360 hardware and has not been tested on a
  # physical Keyball44. The stock connector lacks the MOTION signal, so the
  # driver uses polling.
  - board: nice_nano//zmk
    shield: keyball44_right_pmw3360
    artifact-name: keyball44_right_pmw3360_experimental

  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
